<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Management | Lab 7</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><h1>Student Management</h1>
<p class="text-secondary">Lab 7 · In-memory CRUD · Data resets when the server restarts.</p>
<div class="alert alert-info">Add a student first, then use their ID for attendance and marks. Deleting a student also deletes their attendance and marks.</div>
<div id="message" role="status" class="mb-3"></div>
<label for="module" class="form-label">Module</label><select id="module" class="form-select mb-3">
<option value="students">Students</option><option value="teachers">Teachers</option><option value="attendance">Attendance</option><option value="marks">Marks</option></select>
<form id="recordForm" class="card card-body mb-4"><h2 id="formTitle" class="h5">Add record</h2>
<div id="fields" class="row g-3 mb-3"></div><div><button class="btn btn-dark">Save</button>
<button id="cancel" type="button" class="btn btn-outline-secondary">Cancel edit / Clear</button></div></form>
<div class="table-responsive"><table class="table table-bordered bg-white"><thead id="head"></thead><tbody id="rows"></tbody></table></div></main>
<script>
const schemas = {
 students: {name:'text',rollNo:'text',department:'text'},
 teachers: {name:'text',subject:'text'},
 attendance: {studentId:'number',date:'date',status:'select'},
 marks: {studentId:'number',subject:'text',obtainedMarks:'number',totalMarks:'number'}
};
const moduleSelect = document.getElementById('module');
let records = [], editingId = null;
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url, method='GET', body) {
 const response = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:body ? JSON.stringify(body) : undefined});
 const result = response.status === 204 ? null : await response.json();
 if (!response.ok) throw Error(result.error);
 return result;
}
function message(text) { document.getElementById('message').textContent = text; }
function clearForm() {
 editingId = null;
 document.getElementById('formTitle').textContent = 'Add record';
 document.getElementById('fields').innerHTML = Object.entries(schemas[moduleSelect.value]).map(([key,type]) =>
 `<div class="col-md-4"><label class="form-label" for="${key}">${key}</label>` +
 (type === 'select' ? `<select id="${key}" class="form-select"><option>Present</option><option>Absent</option><option>Leave</option></select>` :
 `<input id="${key}" class="form-control" type="${type}" ${type==='number'?'min="0" step="any"':''} required>`) + '</div>').join('');
}
async function load() {
 records = await api('/'+moduleSelect.value);
 const keys = ['id', ...Object.keys(schemas[moduleSelect.value])];
 document.getElementById('head').innerHTML = '<tr>'+keys.map(k=>`<th>${k}</th>`).join('')+'<th>Options</th></tr>';
 document.getElementById('rows').innerHTML = records.map(r=>'<tr>'+keys.map(k=>`<td>${esc(r[k])}</td>`).join('')+
 `<td><button class="btn btn-sm btn-outline-dark" data-edit="${r.id}">Edit</button> <button class="btn btn-sm btn-outline-danger" data-delete="${r.id}">Delete</button></td></tr>`).join('') || `<tr><td colspan="${keys.length+1}">No records yet.</td></tr>`;
}
document.getElementById('recordForm').onsubmit = async event => {
 event.preventDefault();
 const value = {};
 for (const [key,type] of Object.entries(schemas[moduleSelect.value])) value[key] = type==='number' ? Number(document.getElementById(key).value) : document.getElementById(key).value;
 try { await api('/'+moduleSelect.value+(editingId ? '/'+editingId : ''),editingId?'PUT':'POST',value); clearForm(); await load(); message('Record saved.'); }
 catch(error) { message(error.message); }
};
document.getElementById('rows').onclick = async event => {
 const button = event.target.closest('button'); if (!button) return;
 if (button.dataset.edit) {
  editingId = Number(button.dataset.edit);
  const record = records.find(r=>r.id===editingId);
  for (const key of Object.keys(schemas[moduleSelect.value])) document.getElementById(key).value = record[key];
  document.getElementById('formTitle').textContent = 'Edit record '+editingId;
 } else if (confirm('Delete this record?')) {
  try { await api('/'+moduleSelect.value+'/'+button.dataset.delete,'DELETE'); clearForm(); await load(); message('Record deleted.'); } catch(error) { message(error.message); }
 }
};
moduleSelect.onchange = () => {clearForm(); load().catch(e=>message(e.message)); message('');};
document.getElementById('cancel').onclick = clearForm;
clearForm(); load().catch(e=>message(e.message));
</script></body></html>
